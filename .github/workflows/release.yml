name: Release

# Se dispara solo si los tests pasaron. La version la declara el archivo
# VERSION y el tag se deriva de ella; Packagist publica al recibir el tag.
#
# Para publicar, se sube VERSION en el mismo commit que el cambio. Sin tocarla
# no se publica nada, y un tag que ya existe no se vuelve a crear.
on:
    workflow_run:
        workflows: ['Tests']
        types: [completed]
        branches: [master]
    workflow_dispatch:

jobs:
    release:
        # Explicito y no heredado: un repositorio con el permiso por defecto en
        # solo lectura no puede concederselo al reutilizable, y eso falla el
        # arranque del workflow entero sin log.
        permissions:
            contents: write

        uses: innoboxrr/.github/.github/workflows/php-release.yml@main
